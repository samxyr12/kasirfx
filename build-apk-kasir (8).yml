name: Build APK Kasir POS

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

env:
  # Alamat halaman kasir (HARUS https). Ganti di sini lalu build ulang.
  KASIR_URL: "https://fxidmanage.ct.ws/kasir.php"
  # Semua berkas unduhan disimpan di: Download/<APP_FOLDER>
  APP_FOLDER: "KasirPOS"
  # Alamat berkas suara pesanan masuk (dipakai notifikasi saat app di latar belakang). Kalau tidak ada, pakai nada bawaan HP.
  ORDER_SOUND_URL: "https://fxidmanage.ct.ws/order.mp3"
  RUN_NUMBER: ${{ github.run_number }}

