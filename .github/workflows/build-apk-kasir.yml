name: Build APK Kasir POS

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

env:
  # Alamat halaman kasir (HARUS https). Ganti di sini lalu build ulang.
  KASIR_URL: "https://fxidmanage.ct.ws/kasir.php"
  # Semua berkas unduhan disimpan di: Download/<APP_FOLDER>
  APP_FOLDER: "KasirPOS"
  # Alamat berkas suara pesanan masuk (dipakai notifikasi saat app di latar belakang). Kalau tidak ada, pakai nada bawaan HP.
  ORDER_SOUND_URL: "https://fxidmanage.ct.ws/order.mp3"
  RUN_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak kode aplikasi dari kasir-project.zip (kode lama otomatis diganti)
        run: |
          rm -rf proj
          mkdir proj
          unzip -q kasir-project.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk KasirPOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KasirPOS-apk
          path: KasirPOS.apk

      - name: Buat Release (link unduh langsung + sumber update dalam aplikasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kasir-build-${{ github.run_number }}" KasirPOS.apk --repo "$GITHUB_REPOSITORY" --latest=false --title "Kasir POS build ${{ github.run_number }}" --notes "APK Kasir POS"
