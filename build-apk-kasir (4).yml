      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proj
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk KasirPOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KasirPOS-apk
          path: KasirPOS.apk

      - name: Buat Release (link unduh langsung + sumber update dalam aplikasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kasir-build-${{ github.run_number }}" KasirPOS.apk --repo "$GITHUB_REPOSITORY" --latest=false --title "Kasir POS build ${{ github.run_number }}" --notes "APK Kasir POS"
